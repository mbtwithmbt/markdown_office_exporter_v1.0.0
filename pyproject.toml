[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-office-exporter"
version = "1.0.0"
description = "Function-oriented Markdown to DOCX and Excel table exporter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "lxml>=5.0",
  'requests>=2.32',
  'streamlit>=1.54',
]

[project.scripts]
md-office-export = "md_office_exporter.cli:main"

[tool.setuptools]
packages = ["md_office_exporter"]
